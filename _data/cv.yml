        summary: "Doctoral research supervised by Dr. Dimitar Kazakov."
        highlights:
          - "Built a single-GPU GRPO post-training pipeline with verl and vLLM; used multi-seed experiments and reward controls to diagnose training collapse and investigate interface feedback. Accepted at EMNLP 2026 Main Conference."
          - "Created KinshipQA across seven kinship systems and up to six reasoning hops, with an RDF/OWL and SPARQL generation pipeline and evaluation of six LLMs. Accepted to Findings of EMNLP 2026."
          - "Studied tool-call dependency representations with linear probes, controls, and activation patching across two model families."
          - "Audited residual interventions on target selection, condition reuse, independent eligibility judgments, and complete actions; released reproducible research artifacts."

